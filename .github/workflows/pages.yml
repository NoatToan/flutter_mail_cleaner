name: Web demo (GitHub Pages)

# Static demo build. GitHub Pages has no serverless functions, so the
# IMAP/SMTP bridge in api/ is unavailable here: the build seeds three sample
# mailboxes (DEMO_SEED) instead. The full web app runs on Vercel.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: mail_cleaner

jobs:
  build:
    name: Build web demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build web
        run: >
          flutter build web --release
          --dart-define=DEMO_SEED=true
          --base-href /${{ github.event.repository.name }}/

      # Path-based routes (/inbox/message/42): Pages serves 404.html for
      # unknown paths, so a copy of index.html makes deep links and reloads
      # boot the app instead of a 404 page.
      - name: SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mail_cleaner/build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
