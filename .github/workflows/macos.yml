name: macOS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mail_cleaner

env:
  FLUTTER_CHANNEL: stable

jobs:
  build:
    name: Build & test (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mail_cleaner/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('mail_cleaner/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Build runner (code generation)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build macOS (debug)
        run: flutter build macos --debug
