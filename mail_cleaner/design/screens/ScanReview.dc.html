<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Smart Scan – Kết quả</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0A66D6}a:hover{color:#084FA8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F2F7; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #000; position: relative; overflow: hidden">

  <div style="position: absolute; top: 54px; left: 0; right: 0; height: 44px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; box-sizing: border-box">
    <a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; text-decoration: none; color: #0A66D6; font-size: 17px; justify-self: start">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg><span>Tổng quan</span></a>
    <span style="font-size: 17px; font-weight: 600">Smart Scan</span>
    <button aria-label="Quét lại" style="justify-self: end; width: 44px; height: 44px; border: none; background: transparent; color: #0A66D6; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg>
    </button>
  </div>

  <div style="position: absolute; top: 102px; left: 16px; right: 16px; bottom: 0; display: flex; flex-direction: column; gap: 12px">
    <div style="background: #fff; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-size: 15px; color: #6C6C70">Có thể giải phóng</span>
        <span style="font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.3px">3,2 GB</span>
      </div>
      <div aria-hidden="true" style="display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: #E5E5EA">
        <span style="width: 54%; background: #17803F"></span><span style="width: 46%; background: #E07A00"></span>
      </div>
      <div style="display: flex; gap: 16px; font-size: 13px; color: #3C3C43">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #17803F"></span>An toàn 1,75 GB</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #E07A00"></span>Nên xem lại 1,47 GB</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #157A41; text-transform: uppercase; font-weight: 600; padding: 0 16px">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.9-7.5-9.5V6z"></path></svg>An toàn để xoá</div>
      <div style="background: #fff; border-radius: 12px; overflow: hidden">
        <sc-for list="{{safeItems}}" as="item" hint-placeholder-count="4">
          <button role="checkbox" aria-checked="{{item.ariaChecked}}" onClick="{{item.toggle}}" style="width: 100%; min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border: none; border-bottom: 0.5px solid #E0E0E3; background: #fff; font: inherit; text-align: left; cursor: pointer; box-sizing: border-box">
            <sc-if value="{{item.checked}}" hint-placeholder-val="{{ true }}">
              <span style="width: 24px; height: 24px; border-radius: 12px; background: #0A66D6; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
            </sc-if>
            <sc-if value="{{item.unchecked}}" hint-placeholder-val="{{ false }}">
              <span style="width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid #AEAEB2; box-sizing: border-box; flex: none"></span>
            </sc-if>
            <span style="flex: 1; display: flex; flex-direction: column; min-width: 0">
              <span style="font-size: 17px; color: #000">{{item.name}}</span>
              <span style="font-size: 13px; color: #6C6C70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.desc}}</span>
            </span>
            <span style="font-size: 15px; font-weight: 600; color: #000; font-variant-numeric: tabular-nums">{{item.size}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #B25400; text-transform: uppercase; font-weight: 600; padding: 0 16px">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5M12 16.2v.3"></path></svg>Nên xem lại</div>
      <div style="background: #fff; border-radius: 12px; overflow: hidden">
        <sc-for list="{{reviewItems}}" as="item" hint-placeholder-count="3">
          <button role="checkbox" aria-checked="{{item.ariaChecked}}" onClick="{{item.toggle}}" style="width: 100%; min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border: none; border-bottom: 0.5px solid #E0E0E3; background: #fff; font: inherit; text-align: left; cursor: pointer; box-sizing: border-box">
            <sc-if value="{{item.checked}}" hint-placeholder-val="{{ false }}">
              <span style="width: 24px; height: 24px; border-radius: 12px; background: #0A66D6; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
            </sc-if>
            <sc-if value="{{item.unchecked}}" hint-placeholder-val="{{ true }}">
              <span style="width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid #AEAEB2; box-sizing: border-box; flex: none"></span>
            </sc-if>
            <span style="flex: 1; display: flex; flex-direction: column; min-width: 0">
              <span style="font-size: 17px; color: #000">{{item.name}}</span>
              <span style="font-size: 13px; color: #6C6C70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.desc}}</span>
            </span>
            <span style="font-size: 15px; font-weight: 600; color: #000; font-variant-numeric: tabular-nums">{{item.size}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6C6C70; text-transform: uppercase; font-weight: 600; padding: 0 16px">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Được bảo vệ</div>
      <a href="Settings.dc.html" style="background: #fff; border-radius: 12px; min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-decoration: none; color: #000">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px">Tài chính · HR · Hợp đồng</span><span style="font-size: 13px; color: #6C6C70">1.204 mail · không bao giờ tự động xoá</span></span>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C4C4C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 34px; background: rgba(249,249,249,0.94); border-top: 0.5px solid rgba(60,60,67,0.29); display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #6C6C70"><span>Đã chọn {{selectedCount}} nhóm</span><span>Vào Thùng rác · hoàn tác 30 ngày</span></div>
    <a href="CleanDone.dc.html" style="height: 50px; border-radius: 14px; background: #0A66D6; color: #fff; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">Dọn {{selectedLabel}}</a>
    <div aria-hidden="true" style="position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #000"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const s = this.state || {};
  const safe = [
    { id: 'promo', name: 'Promo cũ > 6 tháng', desc: 'Shopee, Lazada và 40 nơi khác · 3.412 mail', mb: 1088, size: '1,1 GB', def: true },
    { id: 'news', name: 'Newsletter bỏ đọc', desc: 'Tech Brief VN và 11 bản tin · 2.108 mail', mb: 640, size: '640 MB', def: true },
    { id: 'otp', name: 'OTP hết hạn', desc: 'Mã xác thực cũ hơn 7 ngày · 1.906 mail', mb: 12, size: '12 MB', def: true },
    { id: 'notif', name: 'Thông báo cũ', desc: 'Mạng xã hội, giao hàng · 482 mail', mb: 10, size: '10 MB', def: true }
  ];
  const review = [
    { id: 'attach', name: 'Đính kèm lớn', desc: '86 mail có tệp trên 10 MB', mb: 1240, size: '1,2 GB', def: false },
    { id: 'spam', name: 'Thư mục Spam', desc: 'Spam cũ hơn 30 ngày · 640 mail', mb: 150, size: '150 MB', def: false },
    { id: 'dup', name: 'Mail trùng lặp', desc: '312 bản sao giống hệt nhau', mb: 80, size: '80 MB', def: false }
  ];
  let total = 0, count = 0;
  const map = (x) => {
    const on = s[x.id] === undefined ? x.def : s[x.id];
    if (on) { total += x.mb; count += 1; }
    return { ...x, checked: on, unchecked: !on, ariaChecked: on ? 'true' : 'false', toggle: () => this.setState({ [x.id]: !on }) };
  };
  const safeItems = safe.map(map);
  const reviewItems = review.map(map);
  const fmt = (mb) => mb >= 1000 ? (mb / 1000).toFixed(2).replace(/0$/, '').replace('.', ',') + ' GB' : mb + ' MB';
  return { safeItems, reviewItems, selectedLabel: total ? fmt(total) : '0 MB', selectedCount: count };
}
}
</script>
</body>
</html>
